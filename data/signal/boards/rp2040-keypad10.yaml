    driver: スイッチ SW11
    tr_ns: &id002
      value: 10
      basis: assumed
      reason: スイッチ (SW*) がつながるネット。MCU 側は入力で、エッジは接点とプルアップ・ネットの容量で決まり、繰り返しもまれ
      calc: 接点の閉じ始めは数 ns だがチャタリングの中の 1 回で、プルアップ 10 kΩ × 1 nF の RC を入れる設計が多い → 速い側を 10 ns と置く (要確認、overrides で直す)
    tr_eff_ns: 10.0
    f_max_mhz: &id003
      value: 0.001
      basis: assumed
      reason: 人の操作
      calc: 1 kHz 未満
    series_r: null
    source: 'families.yaml switch_input: tr 仮定: スイッチ (SW*) がつながるネット。MCU 側は入力で、エッジは接点とプルアップ・ネットの容量で決まり、繰り返しもまれ (接点の閉じ始めは数 ns だがチャタリングの中の 1 回で、プルアップ 10 kΩ × 1 nF の RC を入れる設計が多い → 速い側を 10 ns と置く (要確認、overrides
      で直す)) / f 仮定: 人の操作 (1 kHz 未満)'
    certainty: 仮
