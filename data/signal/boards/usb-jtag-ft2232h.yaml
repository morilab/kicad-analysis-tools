# ネットごとの信号特性 (リターンパス P20/P21 の点数に使う)。形式は data/signal/README.md
board: usb-jtag-ft2232h
generated_by: 'tools/review/signal_table.py (手で直す値は overrides: に書く。nets: は再生成で上書き)'
defaults:
  c_load_pf:
    value: 10
    basis: assumed
    reason: 直列抵抗の後ろの負荷 (受け側の入力容量 3〜5 pF + 配線 20〜50 mm × 0.1 pF/mm)
    calc: 5 + 5 = 10 pF
  v_mm_per_ns:
    value: 150
    basis: assumed
    reason: FR-4 マイクロストリップの伝搬速度 (実効比誘電率 3〜4)
    calc: c / √4 = 300 / 2 = 150 mm/ns
  hs_usb: true
overrides: {}
nets:
  /ACBUS0:
    driver: U1.26 (ACBUS0_26)
    tr_ns: &id001
      value: 1.5
      basis: assumed
      reason: データシートに出力の立ち上がり時間の規定なし (p.3 1.3 節は USB の tr が EEPROM 設定で変わるとだけ記載、p.48 で I/O の駆動 4/8/12/16 mA と slew は EEPROM 設定)。3.3 V CMOS・既定 4 mA・slew 通常
      calc: tr ≈ 2.2 × R出力 × C負荷 = 2.2 × 45 Ω × 15 pF ≈ 1.5 ns (R出力 30〜60 Ω、C負荷 10〜20 pF で 0.7〜2.6 ns)
    tr_eff_ns: 1.5
    f_max_mhz: &id002
      value: 30
      basis: datasheet
      src:
        page: 34
        table: Table 4.3 MPSSE Signal Timings (Figure 4.7)
        item: These show timings for TCK=30MHz。MPSSE 最大 30 Mbit/s
    series_r: null
    source: 'data/signal/parts/C27882.yaml: tr 仮定: データシートに出力の立ち上がり時間の規定なし (p.3 1.3 節は USB の tr が EEPROM 設定で変わるとだけ記載、p.48 で I/O の駆動 4/8/12/16 mA と slew は EEPROM 設定)。3.3 V CMOS・既定 4 mA・slew 通常 (tr ≈ 2.2 ×
      R出力 × C負荷 = 2.2 × 45 Ω × 15 pF ≈ 1.5 ns (R出力 30〜60 Ω、C負荷 10〜20 pF で 0.7〜2.6 ns)) / f FT2232H Dual High Speed USB to Multipurpose UART/FIFO IC Datasheet FT_000061 Version 2.10 p.34 Table 4.3 MPSSE
      Signal Timings (Figure 4.7)'
    certainty: 仮
