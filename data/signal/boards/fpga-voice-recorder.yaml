    source: 'families.yaml crystal: tr 仮定: 水晶発振 (12 MHz 前後) の波形は正弦波に近い (tr ≈ 0.25 × 周期 = 0.25 × 83 ns ≈ 20 ns) / f 仮定: このリポジトリの基板の水晶は 12 MHz (-)'
    certainty: 仮
