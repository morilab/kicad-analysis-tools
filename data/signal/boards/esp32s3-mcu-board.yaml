# ネットごとの信号特性 (リターンパス P20/P21 の点数に使う)。形式は data/signal/README.md
board: esp32s3-mcu-board
generated_by: 'tools/review/signal_table.py (手で直す値は overrides: に書く。nets: は再生成で上書き)'
defaults:
  c_load_pf:
    value: 10
    basis: assumed
    reason: 直列抵抗の後ろの負荷 (受け側の入力容量 3〜5 pF + 配線 20〜50 mm × 0.1 pF/mm)
    calc: 5 + 5 = 10 pF
  v_mm_per_ns:
    value: 150
    basis: assumed
    reason: FR-4 マイクロストリップの伝搬速度 (実効比誘電率 3〜4)
    calc: c / √4 = 300 / 2 = 150 mm/ns
  hs_usb: false
overrides: {}
nets:
  /CC1:
    driver: コネクタの先 (外部)
    tr_ns: &id001
      value: 2.0
      basis: assumed
      reason: コネクタの先 (相手側のドライバ不明)。JTAG ターゲット・UART 相手の典型的な 3.3 V CMOS
      calc: 1〜5 ns の速い側寄り
    tr_eff_ns: 2.0
    f_max_mhz: null
    series_r: null
    source: 'families.yaml external: tr 仮定: コネクタの先 (相手側のドライバ不明)。JTAG ターゲット・UART 相手の典型的な 3.3 V CMOS (1〜5 ns の速い側寄り)'
    certainty: 仮
  /CC2:
    driver: コネクタの先 (外部)
    tr_ns: *id001
    tr_eff_ns: 2.0
    f_max_mhz: null
    series_r: null
    source: 'families.yaml external: tr 仮定: コネクタの先 (相手側のドライバ不明)。JTAG ターゲット・UART 相手の典型的な 3.3 V CMOS (1〜5 ns の速い側寄り)'
    certainty: 仮
  /EN:
    driver: スイッチ SW1
    tr_ns: &id002
      value: 10
      basis: assumed
      reason: スイッチ (SW*) がつながるネット。MCU 側は入力で、エッジは接点とプルアップ・ネットの容量で決まり、繰り返しもまれ
      calc: 接点の閉じ始めは数 ns だがチャタリングの中の 1 回で、プルアップ 10 kΩ × 1 nF の RC を入れる設計が多い → 速い側を 10 ns と置く (要確認、overrides で直す)
    tr_eff_ns: 10.0
    f_max_mhz: &id003
      value: 0.001
      basis: assumed
      reason: 人の操作
      calc: 1 kHz 未満
    series_r: null
    source: 'families.yaml switch_input: tr 仮定: スイッチ (SW*) がつながるネット。MCU 側は入力で、エッジは接点とプルアップ・ネットの容量で決まり、繰り返しもまれ (接点の閉じ始めは数 ns だがチャタリングの中の 1 回で、プルアップ 10 kΩ × 1 nF の RC を入れる設計が多い → 速い側を 10 ns と置く (要確認、overrides
      で直す)) / f 仮定: 人の操作 (1 kHz 未満)'
    certainty: 仮
  /IO0:
    driver: スイッチ SW2
    tr_ns: *id002
    tr_eff_ns: 10.0
    f_max_mhz: *id003
    series_r: null
    source: 'families.yaml switch_input: tr 仮定: スイッチ (SW*) がつながるネット。MCU 側は入力で、エッジは接点とプルアップ・ネットの容量で決まり、繰り返しもまれ (接点の閉じ始めは数 ns だがチャタリングの中の 1 回で、プルアップ 10 kΩ × 1 nF の RC を入れる設計が多い → 速い側を 10 ns と置く (要確認、overrides
