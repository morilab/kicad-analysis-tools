# pitfall-4l 回帰試験基板 — パターンごとの期待値と根拠 (正解表)
# 座標は基板左上原点 (mm、y 下向き)。KiCad の絶対座標 = (x + 100, y + 100)。寸法は tools/build_pcb.py と対応 (変えたら両方直す)。
# basis: hand_calc = 手計算 (式と代入値を calc に)、datasheet = 資料と項目、standard = IPC 式、tool_ref = kreview の式で手計算、assumed = 仮定 (reason 必須)。
# tolerance: 解析ツールの結果をこの範囲で「合格」とみなす目安 (相対 or 絶対)。
meta:
  board: pitfall-4l
  rev: "0.2"
  changes_from_rev0_1: "熱の対を x=50 で鏡映・端から 15 mm 以上 (基板 100×80 → 100×129)、+5V_RELIEF に L3 ベタ、stackup を .kicad_pcb に記入、熱の期待値をパッド→L2 熱抵抗込みのモデルで再計算、ビア長を銅中心間に統一、連成の合否を収束・比・単調収束に。リターンパス・IR 区画 (y < 57) の座標は不変"
  date: 2026-10-14
  author: "AI 作成 (Grok Bot) / morilab 承認 (作成の指示)"
  status: "机上値。実測なし (発注しない)"
stackup:
  basis: assumed
  reason: "JLCPCB 標準 4 層 1.6 mm JLC04161H-7628 を仮定。rev0.2 から .kicad_pcb の (setup (stackup ...)) に同じ値を記入 (板厚 1.6062 mm、マスク各 10 µm 込み)"
  via_length_definition: "ビア長は銅の中心間 (rev0.2 で統一、pcb-physics irdrop と同じ約束)。L1→L2 0.0175+0.2104+0.0076 = 0.2355、L1→L3 0.0175+0.2104+0.0152+1.065+0.0076 = 1.3157、L1→L4 1.5512 mm"
  layers:
    - {name: F.Cu,  role: "L1 信号",  cu_um: 35}
    - {name: prepreg, h_mm: 0.2104, er: 4.4}
    - {name: In1.Cu, role: "L2 GND ベタ", cu_um: 15.2}
    - {name: core, h_mm: 1.065, er: 4.6}
    - {name: In2.Cu, role: "L3 電源 (+5V_IR / +5V_LDO / +5V_RELIEF / +5V_DENSE / +5V_SPREAD に分割、RELIEF は rev0.2 追加)", cu_um: 15.2}
    - {name: prepreg, h_mm: 0.2104, er: 4.4}
    - {name: B.Cu,  role: "L4 信号", cu_um: 35}
constants:
  rho_cu_20c: {value: 1.72e-8, unit: "ohm m", basis: standard, src: "焼鈍銅 (pcb-physics irdrop.interface.rho_cu と同じ)"}
  alpha_cu:   {value: 0.00393, unit: "1/K", basis: standard}
  t_outer_m:  {value: 35.0e-6, basis: assumed, reason: "1 oz 外層 (めっき前の公称)"}
  via_plating_m: {value: 20.0e-6, basis: assumed, reason: "JLC のビアめっき厚は 18〜25 µm 程度と言われる。中央寄りの 20 µm を置いた (要確認)"}
  ambient_c:  {value: 25, basis: assumed, reason: "試験は室温・無風・基板水平"}

# =====================================================================================================
return_path:
  common:
    formula: "点数 = 1000 × D / (tr_eff × v)、P20: D = max(またぐ長さ, 迂回の長さ)、P21: D = 2 × 最寄り GND via 距離 (中心間)"
    src: "tools/review/return_path.py、skills/design-review/SKILL.md §2.6 (commit bd287ae 点数制、53d87f8 しきい値 ≥100 fail / ≥30 warn)"
    tr_eff_ns: {value: 2.0, basis: assumed, reason: "ドライバはコネクタの先 (families.yaml external、仮)。直列抵抗なし"}
    v_mm_per_ns: 150
    kreview_rev0_2: "rev0.2 (基板を下に延長、y < 57 は不変) で再照合: 7 件とも kreview_rev0_1 と同じ点数・距離 (19 / 25 / 35 / 7 / 17 / 37 / 34)"
    Lr_mm: {value: 300, calc: "2.0 ns × 150 mm/ns"}
    note: "L1 の参照層は L2 (GND)。L4 の参照層 L3 は電源なので kreview の P20 は L4 区間を見ない (仕様)。迂回は 0.25 mm 格子の 8 近傍最短路なので ±0.5 mm 程度ずれる"
  patterns:
    - id: RP-SLIT-W0P5
      net: /RP_SLIT_W0P5
      where: {layer: F.Cu, x: 25.0, y: 6.0, slit: "In1.Cu ルールエリア (ベタ禁止) 幅 0.5 × 長さ 5.5 mm、配線と直交"}
      expected: {D_mm: 6.0, score: 20.0, grade: pass}
      basis: tool_ref
      calc: "迂回 ≈ スリット長 + 幅 = 5.5 + 0.5 = 6.0 mm (配線は中央を横切る: 片側 2.75 mm × 2 + 幅)。点数 = 1000 × 6.0 / 300 = 20.0"
      tolerance: {score_abs: 3}
      kreview_rev0_1: {score: 19, detour_mm: 5.79, cross_mm: 0.40}
    - id: RP-SLIT-W2
      net: /RP_SLIT_W2
      where: {layer: F.Cu, x: 25.0, y: 15.0, slit: "幅 2 × 長さ 5.5 mm"}
      expected: {D_mm: 7.5, score: 25.0, grade: pass}
      basis: tool_ref
      calc: "5.5 + 2 = 7.5 mm → 1000 × 7.5 / 300 = 25.0"
      tolerance: {score_abs: 3}
      kreview_rev0_1: {score: 25, detour_mm: 7.52, cross_mm: 1.81}
    - id: RP-SLIT-W5
      net: /RP_SLIT_W5
      where: {layer: F.Cu, x: 25.0, y: 24.0, slit: "幅 5 × 長さ 5.5 mm"}
      expected: {D_mm: 10.5, score: 35.0, grade: warn}
      basis: tool_ref
      calc: "5.5 + 5 = 10.5 mm → 35.0。幅を 10 倍にしても点数は 1.75 倍: 点数は迂回 (スリット長) が支配する"
      tolerance: {score_abs: 3}
      kreview_rev0_1: {score: 35, detour_mm: 10.53, cross_mm: 4.82}
    - id: RP-VIA-G0P5
      net: /RP_VIA_G0P5
      where: {via: [76.0, 4.0], gnd_via: [76.0, 5.1], note: "via 径 0.6 / 穴 0.3。指定の 0.5 mm は縁どうしの隙間 (中心 0.5 mm は via が重なり作れない)"}
      expected: {d_mm: 1.1, D_mm: 2.2, score: 7.3, grade: pass}
      basis: tool_ref
      calc: "中心間 = 0.6 + 0.5 = 1.1 mm、D = 2 × 1.1 = 2.2、1000 × 2.2 / 300 = 7.3"
      tolerance: {score_abs: 1}
      kreview_rev0_1: {score: 7, d_mm: 1.10}
    - id: RP-VIA-G2
      net: /RP_VIA_G2
      where: {via: [76.0, 11.0], gnd_via: [76.0, 8.4], note: "隙間 2 mm (中心 2.6 mm)。G5 の via から遠ざけるため上側に置く"}
      expected: {d_mm: 2.6, D_mm: 5.2, score: 17.3, grade: pass}
      basis: tool_ref
      calc: "D = 2 × 2.6 = 5.2 → 17.3"
      tolerance: {score_abs: 1}
      kreview_rev0_1: {score: 17, d_mm: 2.60}
    - id: RP-VIA-G5
      net: /RP_VIA_G5
      where: {via: [76.0, 19.0], gnd_via: [76.0, 24.6], note: "隙間 5 mm (中心 5.6 mm)。他に 5.6 mm より近い GND via / GND スルーホールは無い"}
      expected: {d_mm: 5.6, D_mm: 11.2, score: 37.3, grade: warn}
      basis: tool_ref
      calc: "D = 2 × 5.6 = 11.2 → 37.3"
      tolerance: {score_abs: 1}
      kreview_rev0_1: {score: 37, d_mm: 5.60}
    - id: RP-COMB
      net: /RP_COMB
      where: {layer: F.Cu, x: 82.0, y: 27.0, vias: "+5V_IR via 9 本 x = 82、y = 21.6〜31.2 ピッチ 1.2、径 0.7 / 穴 0.3、内層 pad を残す (remove_unused_layers なし)"}
      mechanism: "L2 の逃げ = 半径 0.35 + 0.25 (ベタの間隔) = 0.6 mm がピッチ 1.2 で接し、ベタ最小幅 0.2 mm 未満の銅が消えて縦 10.8 mm のスリットになる。配線は via 5 本目と 6 本目の間を通る"
      expected: {cross_mm: 0.4, D_mm: 10.8, score: 36.0, grade: warn}
      basis: tool_ref
      calc: "櫛の下端 = 31.2 + 0.6 = 31.8、上端 = 21.6 − 0.6 = 21.0。配線 y = 27 から近い下端まで 4.8 mm → 迂回 ≈ 2 × 4.8 + 1.2 = 10.8 mm → 36.0"
      tolerance: {score_abs: 3}
      kreview_rev0_1: {score: 34, detour_mm: 10.31, cross_mm: 0.40}
      finding: "via 径 0.6 (逃げ半径 0.55、接さない) だと銅の切れ目は配線の真下で幅 0.1〜0.2 mm しかなく、kreview は MIN_RUN 0.3 mm 未満として区間を作らない (= 櫛の迂回を見逃す)。実際の帰路は同じく迂回する。kreview 側の課題として報告"

