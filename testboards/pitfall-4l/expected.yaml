ir_drop:
  common:
    supply: "J1 (+5V_IR / GND) に 5.00 V。R1〜R6 = 51 Ω (2512)"
    current_each_a: {value: 0.0980, basis: hand_calc, calc: "5.00 / 51 = 98.0 mA (降下は 1% 未満なので無視)"}
    formula: "R = ρ × L / (w × t)、ΔV = I × R (20 ℃。25 ℃ では ×1.0197)"
    note: "下の値は『そのパターンの銅だけ』の降下。J1 から L3 ベタ (0.5 oz) を通る共通部分は別 (数 mΩ 以下、ツールの値を参考に追記する)"
  patterns:
    - id: IR1-THIN
      net: /+5V_IR
      where: {layer: F.Cu, from: [14.0, 34.0], to: [64.04, 34.0], width_mm: 0.2, length_mm: 50.04, load: R1}
      expected: {R_mohm: 122.9, dV_mV: 12.04}
      basis: hand_calc
      calc: "1.72e-8 × 0.050 / (0.2e-3 × 35e-6) = 0.1229 Ω、× 0.0980 A = 12.04 mV (起点 via (14,34) の L3→L1 1.1 mΩ = 0.1 mV は含まない)"
      tolerance: {rel: 0.05}
    - id: IR2-NECK
      net: /+5V_IR
      where: {layer: F.Cu, zone: IR2_NECK, neck: "x 78〜83、y 35.25〜36.25 (幅 1.0 × 長さ 5.0)", feed: "L3 から via 4 本 (73.5/76 × 34.5/37)", load: R2}
      expected: {R_neck_mohm: 2.457, dV_neck_uV: 241, dV_total_uV: {min: 280, max: 450}}
      basis: hand_calc
      calc: "ネック: 1.72e-8 × 5e-3 / (1e-3 × 35e-6) = 2.457 mΩ → 241 µV。全体 (via 4 本 0.28 mΩ + 両側ブロックの広がり抵抗 約 0.5〜1.5 mΩ) は範囲で示す"
      tolerance: {rel_neck: 0.05}
    - id: IR3-VIA1
      net: /+5V_IR
      where: {vias: 1, at: [77.5, 51.5], load: R3, note: "rev0.2 で R3〜R5 を 1.5 mm 左へ (外周 3 mm 以内の部品配置禁止)"}
      expected: {R_via_mohm: 1.125, dV_via_uV: 110}
      rev0_1: {R_via_mohm: 1.104, dV_via_uV: 108, note: "長さを誘電体 + L2 銅 = 1.29 mm で取っていた (外層・L3 の半厚なし)。irdrop 1.126 mΩ との差 2% はこれで全部説明できた"}
      basis: hand_calc
      calc: "めっき断面 A = π((0.15+0.02)² − 0.15²) = 0.02011 mm²、長さ L1→L3 (銅中心間) = 0.0175 + 0.2104 + 0.0152 + 1.065 + 0.0076 = 1.3157 mm、R = 1.72e-8 × 1.3157e-3 / 0.02011e-6 = 1.125 mΩ → × 98 mA = 110 µV"
      tolerance: {rel: 0.3, why: "めっき厚の仮定 (18〜25 µm) と L3 側の広がり抵抗"}
    - id: IR3-VIA4
      where: {vias: 4, at: "(86 ± 0.6, 50.9 / 52.1)", load: R4}
      expected: {R_via_mohm: 0.281, dV_via_uV: 27.6}
      basis: hand_calc
      calc: "1.125 / 4 (via 間 1.2 mm。平均の値。個々の via は L3 側の広がりで偏る: irdrop で 23〜32 µV)"
      tolerance: {rel: 0.3}
    - id: IR3-VIA9
      where: {vias: 9, at: "(94.5 ± 1.2, 50.3 / 51.5 / 52.7)", load: R5}
      expected: {R_via_mohm: 0.125, dV_via_uV: 12.3}
      basis: hand_calc
      calc: "1.125 / 9。比 1 : 4 : 9 本 → 降下 1 : 0.25 : 0.11 が確認点 (平均。個々の via は ±60% 偏る: irdrop で 7.5〜19.7 µV)"
      tolerance: {rel: 0.3}
    - id: IR4-REMOTE
      net: /+5V_IR
      where: {layer: B.Cu, path: "J1.1 (4.5,36) → (8,36) → (8,55) → (68,55) → via → R6.1", width_mm: 1.0, length_mm: 82.5, note: "L3 ベタに切り欠き (x 64〜72、y 52〜56.5) を入れ、via が L3 とつながらない = L4 の配線だけが経路"}
      expected: {R_mohm: 40.5, dV_mV: 3.97, dV_total_mV: 4.17}
      basis: hand_calc
      calc: "1.72e-8 × 0.0825 / (1e-3 × 35e-6) = 40.5 mΩ → 3.97 mV。+ via L1→L4 (銅中心間 1.5512 mm) 1.327 mΩ → 0.130 mV + L1 1.5 mm 0.74 mΩ → 0.07 mV = 合計 4.17 mV (rev0.1 は via 1.6 mm 1.37 mΩ で 約 4.1)"
      tolerance: {rel: 0.05}

