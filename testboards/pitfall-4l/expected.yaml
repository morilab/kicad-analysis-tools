thermal:
  common:
    ambient_c: 25
    layout_rule: "rev0.2: 比べる対 (U1/U2、DENSE/SPREAD、R19/R20) は基板中心線 x = 50 で鏡映、発熱部品の pad は外形から 15 mm 以上 (最小 15.0 mm: R17/R18 の下端)。各区画に自前の L3 ベタ (LDO / RELIEF / DENSE / SPREAD、DENSE と SPREAD も x = 50 で鏡映)"
    model:
      basis: hand_calc
      tool: "tools/thermal_model.py (本リポ、pcb-physics とは独立。入力は tools/dump_cu.py で .kicad_pcb から書き出した外層の銅・via・内層ベタ)"
      what: >-
        3 層の定常熱伝導 (格子 0.25 mm)。(a) 板 = L2 + L3 + FR-4 を束ねた 2D 板、面内 kt = 385 × 15.2 µm × (L2 有 + L3 有) + 0.8 × 1.57 mm
        (L2+L3 で 0.0130 W/K)。(b) L1・L4 の銅 (ネットごとに横に導通、385 × 35 µm = 0.0135 W/K)。(c) 銅 ↔ 板はプリプレグ 0.2104 mm、
        k = 0.3 W/mK (1426 W/m²K) = rev0.1 に無かった『パッド → L2』の熱抵抗。via / THT はめっき 20 µm の筒で、GND は L2、L3 ベタのある電源は L3 までの
        銅中心間の長さで板とつなぐ (+3V3 のサーマルビアは L1 ↔ L4 だけ)。放熱は板全面: 自然対流 (水平板 上面 1.32 (ΔT/L)^0.25 + 下面 0.66 (ΔT/L)^0.25、
        L = 面積/周長、ΔT = 板平均) + 放射 (両面 ε 0.9、セルごとの温度)、温度で 5 回更新。外形の端面は断熱。部品本体からの放熱は無視。
        抵抗 = 1 点の発熱体を両 pad に 0.5 K/W ずつ、pad 温度 = pad の銅の最高。LDO = 接合 → タブ pad に θJC 15 K/W
      pad_to_L2: "2512 の pad (1.2 × 3.4 mm) → L2: プリプレグだけなら 1 pad 約 113 K/W (縁の広がり 0.21 mm 込み)、配線 + via の並列路込みでモデルの実効値は 抵抗 1 個あたり 約 60 K/W (pad − 直下の板 = 29 K / 0.49 W)。pcb-physics rev0.1 は 55 K/W 相当 (80 − 53 K)"
      wire_to_L2: "配線 → L2 の線コンダクタンス G' = k (w/h + 1.0) (平行平板 + 両縁の広がり、h = 0.2104 mm): 0.3 mm → 0.728、0.2 mm → 0.585 W/mK。配線温度 = 板温度 (線熱源を板に入れて解く) + q'/G'"
      check_on_rev0_1:
        note: "同じモデルを rev0.1 の基板に当てた値と pcb-physics 6e605fe (rev0.1) の比較。モデルは温度上昇を 12〜15% 高めに出す (対流・放射の h と部品上面の放熱の差と見る)。傾向 (dense/spread 比 < 1、U2 が端に近いことによる差) は一致"
        U1_Tj_c: {model: 108.6, pcb_physics: 99.25}
        U2_Tj_c: {model: 122.9, pcb_physics: 110.6}
        U2_minus_U1_c: {model: 14.3, pcb_physics: 11.38, note: "rev0.1 では U2 が下端から 5.5 mm。差の大半は端の効果で、サーマルビアの効果ではなかった"}
        dense_pad_rise_k: {model: 92.1, pcb_physics: 79.82}
        spread_pad_rise_k: {model: 94.8, pcb_physics: 82.69}
        ratio_dense_over_spread: {model: 0.97, pcb_physics: 0.965}
        R19_minus_R20_c: {model: 3.6, pcb_physics: -2.42, note: "符号が逆。rev0.1 は R20 が下端から 5.8 mm で板が熱い。リリーフ (隙間 0.5、スポーク 0.3) の解像度の差もありうる → rev0.2 の鏡映で切り分ける"}
        TH1A_wire_rise_k: {model: 4.1, pcb_physics: 2.99}
        CP1A5_wire_max_c: {model: 42.7, pcb_physics: 36.16, irdrop_bot: 38.4}
    tolerance_note: "熱の絶対値の範囲は温度上昇に対して −35% / +20% (pcb-physics 63d05dc は本モデルより 15〜25% 低く出る系統差があるため下側を広く取った)。合否の主は差・比 (対が鏡映なので配置の効果が消え、パターンの効果だけが残る)"
    tool_results_rev0_2:
      src: "pcb-physics main 63d05dc examples/pitfall-4l/results-rev0.2.json (typ、熱 0.25 mm・IR 0.1 mm)。基板は 80bb9f7 (R3〜R5 移動・内層ベタの外周 1 mm 化の前。熱の区画は同じ)"
      U1_Tj_c: 76.3
      U2_Tj_c: 78.9
      U2_minus_U1_c: 2.58
      dense_pad_rise_k: 72.9
      spread_pad_rise_k: 54.0
      ratio_dense_over_spread: 1.35
      R19_minus_R20_gnd_pad_c: 5.5
      plate_R19_minus_R20_c: 0.42
      TH1A_wire_rise_k: 2.94
      CP1A5: {V_mV: 194.3, R_mohm: 129.5, T_eff_c: 35.2, T_eff_calc: "20 + (129.51 / 122.22 − 1) / 0.00393", iterations: 4, monotonic: true}
      verdict: "全項目が下の範囲に入る (範囲の改訂前も入っていたが U1/U2/密集/TH-1A/CP は下限まで 0.4〜3.3 K しかなかった)。系統差: 温度上昇でモデル比 −14〜−21%"
  patterns:
    - id: TH-LDO-VIA / TH-LDO-NOVIA
      parts: {with_vias: U1, without_vias: U2}
      condition: "J10 に 5.00 V、負荷 22 Ω × 2 並列 → 各 LDO 0.300 A。U1・U2 と R7〜R10 を同時に通電"
      where: {U1: [24.0, 70.0], U2: [76.0, 70.0], U2_rot: 180, mirror_axis_x: 50, tab_cu: "L1 +3V3 ベタ 13.3 × 7 mm (93 mm²、両方同じ、鏡映)", U1_vias: "9 本 (x 29.1/30.3/31.5 × y 68.8/70/71.2) → L4 ベタ x 15〜41 × y 65〜75.5 (273 mm²)", loads: "R7/R8 (41.5, 68/72)、R9/R10 (58.5, 68/72)", edge_min_mm: 19.8}
      Pd_w: {value: 0.535, basis: hand_calc, calc: "(5.0 − 3.3) × 0.30 + 5.0 × 0.005 (Iq 5 mA 仮定) = 0.535 W。負荷抵抗は 3.3²/22 = 0.495 W × 4"}
      datasheet_check:
        basis: datasheet
        src: "Advanced Monolithic Systems AMS1117 データシート (LCSC C6186 の PDF、8 ページ、sha256 189a2651878a87d5…)"
        theta_jc: {value: 15, text: "Thermal Resistance Junction-to-Case 15 °C/W、本文『junction to the tab 15°C/W』"}
