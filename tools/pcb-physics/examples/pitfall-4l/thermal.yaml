# pitfall-4l rev0.1 (正解付き 4 層の試験基板、リポジトリの testboards/pitfall-4l、読むだけ) の熱解析条件
# 区画ごとに 1 つずつ通電する (expected.yaml thermal / coupled)。scenarios: に区画ごとの通電部品を書き、run_pitfall.py が 1 区画ずつ解く。
# 条件は expected.yaml の値 (5.00 V、51 Ω / 22 Ω、AMS1117 0.3 A) を案件条件 (design) として写した。typ と max は同じ値 (抵抗で決まる)。
project: pitfall-4l
rev: "0.1"
board: ../../data/board/pitfall-4l-rev0.1.yaml
grid_mm: 0.25
environment:                   # expected.yaml: 室温 25 ℃・無風・基板水平
  orientation: horizontal_top_up
  vertical_axis: y
  airflow: {velocity_m_s: 0.0, direction: x}
  emissivity: {top: 0.9, bottom: 0.9}
  case: {enabled: false, internal_air_rise_c: 10, h_factor: 0.6, wall_rise_c: 10, wall_emissivity: 0.9}
cases:
  typ:   {environment: {ambient_c: 25}}
  worst: {environment: {ambient_c: 25}}
stackup: null
plot: {tmin_c: 25, tmax_c: 95, cmap: inferno, over_color: "#9b30ff"}
parts:
  U1:
    power:
      model: ldo
      vin: {value: 5.0, basis: design, from: "expected.yaml TH-LDO: J10 に 5.00 V"}
      vout: {value: 3.3, basis: design, from: "AMS1117-3.3 の固定出力"}
      iq: {value: 0.005, basis: assumed, reason: "expected.yaml の Pd の式の Iq 5 mA 仮定", calc: "5.0 V × 5 mA = 25 mW"}
      loads:
        - name: "負荷 22 Ω × 2 並列"
          typ: {value: 0.300, basis: design, from: "expected.yaml TH-LDO: 22 Ω × 2 並列 → 0.300 A"}
          max: {value: 0.300, basis: design, from: "同上"}
