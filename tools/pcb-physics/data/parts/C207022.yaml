# Littelfuse 0805L050WR (0805 ポリマー PTC リセッタブルヒューズ、Ihold 0.50 A)。値オブジェクトの書き方は core/parts.py の先頭 (basis 必須)
# 熱抵抗はデータシートに無い (受動部品)。熱側は発熱 P = I² R を pad 直下に置き、pad 温度を表示する。
# PTC なので抵抗は温度で上がる (データシートに R(T) の表は無い)。抵抗値は 20 ℃ の値。保持電流の温度ディレーティング表 (hold_current_derating) で余裕を見る。
# 2026-10-19 IR ドロップ側 (pdn-edge、main b6e5552 との merge): pdn-v0.1 929d23d の IR・PDN 用 C207022.yaml (Revised 04/01/14 を元に dc_resistance / ratings で記述) と統合。
#   値はデータシートの新しい版 (Revised 03/22/17、本ファイル = main 側) に統一。R min 0.150・R 1max 0.850 Ω・温度表は両版で同じ。
#   R typ 0.50 Ω は旧版 (04/01/14) では表に記載あり、新しい版では記載なしのため main どおり仮定値 (中点) とする (値は同じ)。
#   IR (irdrop/run.py) と PDN (pdn/run.py) は core/parts.series_resistance で resistance (typ/max) と resistance_min を読む (dc_resistance が無い部品はこちら)。
#   ratings (i_hold / i_trip / v_max) は hold_current / trip_current / v_max / hold_current_derating に一本化。
#   温度補正: 抵抗の温度係数はデータシートに無い (PTC は非線形) ので resistance.tc_per_c = null (補正しない)
lcsc: C207022
mpn: 0805L050WR
maker: Littelfuse
package: "0805 (2012 metric)"
datasheet: {title: "POLY-FUSE Resettable PTCs, Surface Mount > 0805L Series", doc: "0805L Series datasheet", rev: "Revised: 03/22/17 (© 2017 Littelfuse、全 5 ページ)",
            url: "https://datasheet.lcsc.com/datasheet/pdf/c1633066ff911e714178a6666bd78932.pdf?productCode=C207022 (LCSC 商品ページ C207022 の Datasheet。Littelfuse 公式 https://www.littelfuse.com/assetdocs/littelfuse-ptc-0805l-datasheet は取得できず)"}
resistance:                     # typ / max (案件 thermal.yaml の power.r に写す。max = R 1max)
  typ:
    value: 0.50
    basis: assumed
    reason: "データシートに標準値 (R typ) の記載なし (表は R min と R 1max だけ。注の R typ は定義だけで値なし)。実装後 (リフロー後) は R min より上がり R 1max 以下に収まるので、その中間を置いた"
    calc: "R typ ≈ (R min + R 1max) / 2 = (0.150 + 0.850) / 2 = 0.50 Ω (20 ℃。発熱は R に比例するので R min なら 0.3 倍、R 1max なら 1.7 倍)"
  max: {value: 0.850, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L050: R 1max 0.850 Ω (20 ℃、トリップ後 1 時間 または 260 ℃ 20 s リフロー後の最大)"}}
  tc_per_c: {value: null, checked: "p.1〜3 に抵抗の温度係数の記載なし (PTC は非線形)。IR では温度補正しない"}
  t_ref_c: {value: 20, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L050: R min・R 1max は 20 ℃ の値"}}
resistance_min: {value: 0.150, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L050: R min 0.150 Ω (初期状態・はんだ付け前の最小)"}}
hold_current:
  value: 0.50
  basis: datasheet
  src: {page: 1, table: "Electrical Characteristics", item: "0805L050: I hold 0.50 A (20 ℃ 静止空気でトリップせずに流せる最大電流)"}
trip_current: {value: 1.00, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L050: I trip 1.00 A (20 ℃ 静止空気でトリップする最小電流)"}}
v_max: {value: 6, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L050: V max 6 Vdc"}}
i_max: {value: 100, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L050: I max 100 A"}}
pd_tripped: {value: 0.5, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L050: P d typ. 0.5 W (トリップ状態、20 ℃ 静止空気)"}}
time_to_trip: {value: 0.10, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L050: Maximum Time To Trip 8.00 A で 0.10 s"}}
hold_current_derating:          # 周囲温度 [℃] → 保持電流 [A]
  value: {-40: 0.68, -20: 0.62, 0: 0.55, 20: 0.50, 40: 0.40, 50: 0.37, 60: 0.33, 70: 0.29, 85: 0.23}
  basis: datasheet
  src: {page: 2, table: "Temperature Rerating (Ambient Operation Temperature / Hold Current (A))", item: "0805L050 の行。注: 参考値 (詳細は Littelfuse 技術サポートへ)"}
operating_temp_low_c: {value: -40, basis: datasheet, src: {page: 3, table: "Environmental Specifications", item: "Operating/Storage Temperature -40 ℃ to +85 ℃"}}
operating_temp_high_c: {value: 85, basis: datasheet, src: {page: 3, table: "Environmental Specifications", item: "同上 +85 ℃"}}
surface_temp_tripped_max_c: {value: 125, basis: datasheet, src: {page: 3, table: "Environmental Specifications", item: "Maximum Device Surface Temperature in Tripped State 125 ℃"}}
tj_max: {value: null, checked: "p.1〜3 (半導体でないので接合温度なし。使用温度上限 85 ℃ は operating_temp_high_c)"}
theta:
  ja: {value: null, checked: "全 5 ページ (熱抵抗の記載なし)"}
  jb: {value: null, checked: "同上"}
  jc_bottom: {value: null, checked: "同上"}
  jc_top: {value: null, checked: "同上"}
  psi_jb: {value: null, checked: "同上"}
dimensions:
  length: {value: 2.20, basis: datasheet, src: {page: 4, table: "Dimensions", item: "0805L050: A 2.00〜2.20 mm (最大)"}}
  width: {value: 1.50, basis: datasheet, src: {page: 4, table: "Dimensions", item: "0805L050: B 1.20〜1.50 mm (最大)"}}
  height: {value: 1.25, basis: datasheet, src: {page: 4, table: "Dimensions", item: "0805L050: C 0.75〜1.25 mm (最大)"}}
exposed_pad: {value: false, basis: datasheet, src: {page: 4, table: "Dimensions", item: "2 端子チップ (電極 2 個)"}}
tab: {value: false, basis: datasheet, src: {page: 4, table: "Dimensions", item: "2 端子チップ"}}
extracted: {by: "pdftotext -layout + 目視 (AI)", date: 2026-10-19, checked_by: null}
