# Littelfuse 0805L110WR (0805 ポリマー PTC リセッタブルヒューズ、Ihold 1.10 A)。値オブジェクトの書き方は core/parts.py の先頭 (basis 必須)
# 熱抵抗はデータシートに無い (受動部品)。熱側は発熱 P = I² R を pad 直下に置き、pad 温度を表示する。
# PTC なので抵抗は温度で上がる (データシートに R(T) の表は無い)。抵抗値は 20 ℃ の値。保持電流の温度ディレーティング表 (hold_current_derating) で余裕を見る。
# 2026-10-19 IR ドロップ側 (pdn-edge、main b6e5552 との merge): pdn-v0.1 929d23d の IR・PDN 用 C468889.yaml (Revised 04/01/14 を元に dc_resistance / ratings で記述) と統合。
#   値はデータシートの新しい版 (Revised 06/17/19、本ファイル = main 側) に統一。R min 0.050・R 1max 0.160 Ω・R typ 仮定 0.105 Ω は両版で同じ。
#   保持電流の温度表は版で違い、新しい版 (70 ℃ 0.65 / 85 ℃ 0.52 A) を採る (旧 04/01/14 の 70 ℃ 0.68 / 85 ℃ 0.55 A は使わない)。
#   IR (irdrop/run.py) と PDN (pdn/run.py) は core/parts.series_resistance で resistance (typ/max) と resistance_min を読む (dc_resistance が無い部品はこちら)。
#   ratings (i_hold / i_trip / v_max / i_hold_vs_ambient_c) は hold_current / trip_current / v_max / hold_current_derating に一本化。
#   温度補正: 抵抗の温度係数はデータシートに無い (PTC は非線形) ので resistance.tc_per_c = null (補正しない。R 1max は 20 ℃ の値なので 80 ℃ 台では実際はこれより高い可能性 = 楽観側)
lcsc: C468889
mpn: 0805L110WR
maker: Littelfuse
package: "0805 (2012 metric)"
datasheet: {title: "POLY-FUSE Resettable PTCs, Surface Mount > 0805L Series", doc: "0805L Series datasheet", rev: "Revised: 06/17/19 (© 2019 Littelfuse、全 5 ページ)",
            url: "https://datasheet.lcsc.com/datasheet/pdf/c17e5746468f5af7a5a1608f2b849001.pdf?productCode=C468889 (LCSC 商品ページ C468889 の Datasheet)"}
resistance:                     # typ / max (案件 thermal.yaml の power.r に写す。max = R 1max)
  typ:
    value: 0.105
    basis: assumed
    reason: "データシートに標準値 (R typ) の記載なし (表は R min と R 1max だけ。注の R typ は定義だけで値なし)。実装後 (リフロー後) は R min より上がり R 1max 以下に収まるので、その中間を置いた (C207022 と同じ考え方)"
    calc: "R typ ≈ (R min + R 1max) / 2 = (0.050 + 0.160) / 2 = 0.105 Ω (20 ℃。発熱は R に比例するので R min なら 0.48 倍、R 1max なら 1.52 倍)"
  max: {value: 0.160, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L110: R 1max 0.160 Ω (20 ℃、トリップ後 1 時間 または 260 ℃ 20 s リフロー後の最大)"}}
  tc_per_c: {value: null, checked: "p.1〜3 に抵抗の温度係数の記載なし (PTC は非線形)。IR では温度補正しない"}
  t_ref_c: {value: 20, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L110: R min・R 1max は 20 ℃ の値"}}
resistance_min: {value: 0.050, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L110: R min 0.050 Ω (初期状態・はんだ付け前の最小)"}}
hold_current:
  value: 1.10
  basis: datasheet
  src: {page: 1, table: "Electrical Characteristics", item: "0805L110: I hold 1.10 A (20 ℃ 静止空気でトリップせずに流せる最大電流)"}
trip_current: {value: 2.00, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L110: I trip 2.00 A (20 ℃ 静止空気でトリップする最小電流)"}}
v_max: {value: 6, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L110: V max 6 Vdc"}}
i_max: {value: 100, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L110: I max 100 A"}}
pd_tripped: {value: 0.8, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L110: P d typ. 0.8 W (トリップ状態、20 ℃ 静止空気)"}}
time_to_trip: {value: 0.10, basis: datasheet, src: {page: 1, table: "Electrical Characteristics", item: "0805L110: Maximum Time To Trip 8.00 A で 0.10 s"}}
hold_current_derating:          # 周囲温度 [℃] → 保持電流 [A]
  value: {-40: 1.45, -20: 1.35, 0: 1.20, 20: 1.10, 40: 0.92, 50: 0.84, 60: 0.75, 70: 0.65, 85: 0.52}
  basis: datasheet
  src: {page: 2, table: "Temperature Rerating (Ambient Operation Temperature / Hold Current (A))", item: "0805L110 の行。注: 参考値 (詳細は Littelfuse 技術サポートへ)。85 ℃ は 0.52 A (0.55 A は 0805L100 の 70 ℃ の値)"}
operating_temp_low_c: {value: -40, basis: datasheet, src: {page: 3, table: "Environmental Specifications", item: "Operating/Storage Temperature -40 ℃ to +85 ℃"}}
operating_temp_high_c: {value: 85, basis: datasheet, src: {page: 3, table: "Environmental Specifications", item: "同上 +85 ℃"}}
surface_temp_tripped_max_c: {value: 125, basis: datasheet, src: {page: 3, table: "Environmental Specifications", item: "Maximum Device Surface Temperature in Tripped State 125 ℃"}}
tj_max: {value: null, checked: "p.1〜3 (半導体でないので接合温度なし。使用温度上限 85 ℃ は operating_temp_high_c)"}
theta:
  ja: {value: null, checked: "全 5 ページ (熱抵抗の記載なし)"}
  jb: {value: null, checked: "同上"}
  jc_bottom: {value: null, checked: "同上"}
  jc_top: {value: null, checked: "同上"}
  psi_jb: {value: null, checked: "同上"}
dimensions:
  length: {value: 2.20, basis: datasheet, src: {page: 4, table: "Dimensions", item: "0805L110: A 2.00〜2.20 mm (最大)"}}
  width: {value: 1.50, basis: datasheet, src: {page: 4, table: "Dimensions", item: "0805L110: B 1.20〜1.50 mm (最大)"}}
  height: {value: 1.40, basis: datasheet, src: {page: 4, table: "Dimensions", item: "0805L110: C 0.80〜1.40 mm (最大)"}}
exposed_pad: {value: false, basis: datasheet, src: {page: 4, table: "Dimensions", item: "2 端子チップ (電極 2 個)"}}
tab: {value: false, basis: datasheet, src: {page: 4, table: "Dimensions", item: "2 端子チップ"}}
extracted: {by: "pdftotext -layout + 目視 (AI)", date: 2026-10-19, checked_by: null}
