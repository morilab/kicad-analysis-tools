dc_resistance:
  typ: {value: 0.30, basis: assumed, reason: "データシートは DCR の最大値 0.45 Ω のみ (標準値なし)。積層フェライトビーズの実測 DCR は最大値の 60〜75% 程度が一般的", calc: "0.45 × 2/3 = 0.30 Ω"}
